# config/policies/stage4-readonly.toml

# 1. Default deny all tools (effective priority 500)
[[rule]]
toolName = "*"
decision = "deny"
priority = 500
deny_message = "Stage 4 RCA reasoning is strictly read-only. Mutation tools and arbitrary shell commands are forbidden."

# 2. Allow safe built-in read-only file/search tools (effective priority 700)
[[rule]]
toolName = [
  "view_file",
  "read_file",
  "grep_search",
  "find_by_name",
  "list_dir",
  "glob"
]
decision = "allow"
priority = 700

# 3. Allow read-only MCP tools (effective priority 800)
[[rule]]
toolName = [
  "akashic_query",
  "akashic_inspect",
  "akashic_lint",
  "vault_read",
  "query_graph",
  "get_node",
  "get_neighbors",
  "get_community",
  "god_nodes",
  "graph_stats",
  "shortest_path",
  "alexandria_search",
  "alexandria_callers",
  "alexandria_callees",
  "alexandria_impact"
]
decision = "allow"
priority = 800

# 4. Explicitly block file-mutation and shell-execution tools (effective priority 950)
[[rule]]
toolName = [
  "write_to_file",
  "replace_file_content",
  "write_file",
  "edit_file",
  "delete_file",
  "vault_write_canonical",
  "run_command",
  "run_shell_command",
  "bash",
  "sh",
  "manage_task"
]
decision = "deny"
priority = 950
deny_message = "Stage 4 cannot mutate files, execute shell commands, or manage tasks; execution is strictly read-only."
