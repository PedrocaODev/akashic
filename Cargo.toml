[workspace]
resolver = "2"
members = [
    "crates/rca-conductor",
    "crates/rca-sanitizer",
    "crates/rca-symbolicator",
    "crates/rca-crystallizer",
    "crates/rca-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
akashic = { path = "/home/pedrogoncalves/projects/akashic-records" }
alexandria-core = { path = "/home/pedrogoncalves/projects/alexandria/crates/alexandria-core" }
alexandria-daemon = { path = "/home/pedrogoncalves/projects/alexandria/crates/alexandria-daemon" }
rca-conductor = { path = "crates/rca-conductor" }
rca-sanitizer = { path = "crates/rca-sanitizer" }
rca-symbolicator = { path = "crates/rca-symbolicator" }
rca-crystallizer = { path = "crates/rca-crystallizer" }

tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tracing = "0.1"
clap = { version = "4.5", features = ["derive"] }
