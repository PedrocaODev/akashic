[workspace]
resolver = "2"
members = [
    "crates/akashic-sanitize",
    "crates/akashic-embedding",
    "crates/akashic-vault",
    "crates/akashic-lint",
    "crates/akashic-engine",
    "crates/akashic-rca",
    "crates/akashic-daemon",
    "crates/akashic-core",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
akashic-sanitize = { path = "crates/akashic-sanitize" }
akashic-embedding = { path = "crates/akashic-embedding" }
akashic-vault = { path = "crates/akashic-vault" }
akashic-lint = { path = "crates/akashic-lint" }
akashic-engine = { path = "crates/akashic-engine" }
akashic-rca = { path = "crates/akashic-rca" }
akashic-daemon = { path = "crates/akashic-daemon" }
akashic-core = { path = "crates/akashic-core" }

tokio = { version = "1.40", features = ["full"] }
tokio-util = { version = "0.7", features = ["codec"] }
futures-util = "0.3"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
thiserror = "2.0"
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
clap = { version = "4.5", features = ["derive"] }
regex = "1.10"
sha2 = "0.10"
petgraph = "0.7"
walkdir = "2.5"
pulldown-cmark = "0.12"
difflib = "0.4"
fs2 = "0.4"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fastrand = "2.0"
tree-sitter = "0.24"
tree-sitter-java = "0.23"
tree-sitter-kotlin = { package = "brokk-tree-sitter-kotlin", version = "0.4.2" }
streaming-iterator = "0.1.9"
tempfile = "3.10"
rmcp = { version = "3.5", features = ["server", "macros", "transport-io"] }
schemars = { version = "1.2", features = ["derive"] }
sqlite-vec = "0.1.9"
zerocopy = "0.8"
